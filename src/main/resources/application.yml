spring:
  application:
    name: orm-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orm_platform}
    username: ${DB_USER:orm}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_SCHEMA_MODE:update}
server:
  port: ${PORT:8080}
