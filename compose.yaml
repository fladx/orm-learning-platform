services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orm_platform
      POSTGRES_USER: ${DB_USER:-orm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://database:5432/orm_platform
      DB_USER: ${DB_USER:-orm}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-true}
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
